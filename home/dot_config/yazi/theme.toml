[flavor]
dark = "onedark"
light = "onedark"

[mgr]
border_symbol = "┃"
border_style = { fg = "#5c6370", bg = "#282c34", bold = true }

[filetype]
rules = [
  { url = "*/", fg = "#61afef" },
  { url = "*", fg = "#abb2bf" },
]

[indicator]
parent = { bg = "#31353f", reversed = false }
current = { bg = "#393f4a", reversed = false }
preview = { bg = "#31353f", reversed = false, underline = false }
padding = { open = " ", close = " " }

[tabs]
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[status]
overall = { fg = "#abb2bf", bg = "#393f4a" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

[mode]
normal_main = { fg = "#282c34", bg = "#61afef", bold = true }
normal_alt = { fg = "#61afef", bg = "#31353f" }
select_main = { fg = "#282c34", bg = "#c678dd", bold = true }
select_alt = { fg = "#c678dd", bg = "#31353f" }
unset_main = { fg = "#282c34", bg = "#e86671", bold = true }
unset_alt = { fg = "#e86671", bg = "#31353f" }
