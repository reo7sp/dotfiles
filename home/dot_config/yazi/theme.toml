[flavor]
dark = "catppuccin-latte"
light = "catppuccin-latte"

[mgr]
border_symbol = "┃"
border_style = { fg = "#cbced8", bg = "#ffffff", bold = true }

[filetype]
rules = [
  { url = "*/", fg = "#1e66f5" },
  { url = "*", fg = "#4c4f69" },
]

[indicator]
parent = { bg = "#dbdee6", reversed = false }
current = { bg = "#e1e4eb", reversed = false }
preview = { bg = "#dbdee6", reversed = false, underline = false }
padding = { open = " ", close = " " }

[tabs]
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[status]
overall = { fg = "#4c4f69", bg = "#dbdee6" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

[mode]
normal_main = { fg = "#f0f1f6", bg = "#1e66f5", bold = true }
normal_alt = { fg = "#1e66f5", bg = "#dbdee6" }
select_main = { fg = "#ffffff", bg = "#8839ef", bold = true }
select_alt = { fg = "#8839ef", bg = "#dbdee6" }
unset_main = { fg = "#ffffff", bg = "#d20f39", bold = true }
unset_alt = { fg = "#d20f39", bg = "#dbdee6" }
