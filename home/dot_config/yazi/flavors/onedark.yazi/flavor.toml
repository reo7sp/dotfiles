# Adapted from https://github.com/BennyOe/onedark.yazi
[app]
overall = { bg = "#282c34" }

[mgr]
cwd = { fg = "#61afef" }
find_keyword = { fg = "#e06c75", italic = true, underline = true }
find_position = { fg = "#e5c07b", italic = true }
marker_copied = { fg = "#98c379", bg = "#98c379" }
marker_cut = { fg = "#e06c75", bg = "#e06c75" }
marker_marked = { fg = "#56b6c2", bg = "#56b6c2" }
marker_selected = { fg = "#e5c07b", bg = "#e5c07b" }
count_copied = { fg = "#98c379", bg = "#282c34" }
count_cut = { fg = "#e06c75", bg = "#282c34" }
count_selected = { fg = "#98c379", bg = "#282c34" }

[tabs]
active = { fg = "#282c34", bg = "#61afef", bold = true }
inactive = { fg = "#abb2bf", bg = "#31353f" }

[status]
perm_type = { fg = "#98c379" }
perm_read = { fg = "#e06c75" }
perm_write = { fg = "#e5c07b" }
perm_exec = { fg = "#98c379" }
perm_sep = { fg = "#abb2bf" }
progress_label = { fg = "#abb2bf", bold = true }
progress_normal = { fg = "#98c379", bg = "#282c34" }
progress_error = { fg = "#e06c75", bg = "#282c34" }

[pick]
border = { fg = "#98c379" }
active = { fg = "#e5c07b", bold = true }
inactive = { fg = "#abb2bf" }

[input]
border = { fg = "#98c379" }
value = { fg = "#abb2bf" }
selected = { reversed = true }

[cmp]
border = { fg = "#98c379" }

[tasks]
border = { fg = "#98c379" }
hovered = { fg = "#e5c07b", underline = true }

[which]
cand = { fg = "#98c379" }
rest = { fg = "#abb2bf" }
desc = { fg = "#e5c07b" }
separator = "  "
separator_style = { fg = "#abb2bf" }

[help]
on = { fg = "#98c379" }
run = { fg = "#e5c07b" }
hovered = { reversed = true, bold = true }
footer = { fg = "#abb2bf", bg = "#21252b" }

[spot]
border = { fg = "#98c379" }
title = { fg = "#61afef" }
tbl_col = { fg = "#56b6c2" }
tbl_cell = { fg = "#abb2bf", bg = "#393f4a" }

[notify]
title_info = { fg = "#98c379" }
title_warn = { fg = "#e5c07b" }
title_error = { fg = "#e06c75" }

[icon]

dirs = [
	{ name = ".config", text = "", fg = "#c678dd" },
	{ name = ".git", text = "", fg = "#56b6c2" },
	{ name = ".github", text = "", fg = "#61afef" },
	{ name = ".npm", text = "", fg = "#61afef" },
	{ name = "Desktop", text = "", fg = "#56b6c2" },
	{ name = "Development", text = "", fg = "#56b6c2" },
	{ name = "Documents", text = "", fg = "#56b6c2" },
	{ name = "Downloads", text = "", fg = "#56b6c2" },
	{ name = "Library", text = "", fg = "#56b6c2" },
	{ name = "Movies", text = "", fg = "#56b6c2" },
	{ name = "Music", text = "", fg = "#56b6c2" },
	{ name = "Pictures", text = "", fg = "#56b6c2" },
	{ name = "Public", text = "", fg = "#56b6c2" },
	{ name = "Videos", text = "", fg = "#56b6c2" },
]
conds = [
	# Special files
	{ if = "orphan", text = "", fg = "#abb2bf" },
	{ if = "link", text = "", fg = "#848b98" },
	{ if = "block", text = "", fg = "#d19a66" },
	{ if = "char", text = "", fg = "#d19a66" },
	{ if = "fifo", text = "", fg = "#d19a66" },
	{ if = "sock", text = "", fg = "#d19a66" },
	{ if = "sticky", text = "", fg = "#d19a66" },
	{ if = "dummy", text = "", fg = "#e06c75" },

	# Fallback
	{ if = "dir & hovered", text = "", fg = "#61afef" },
	{ if = "dir", text = "", fg = "#61afef" },
	{ if = "exec", text = "", fg = "#98c379" },
	{ if = "!dir", text = "", fg = "#abb2bf" },
]
